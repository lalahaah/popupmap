<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- 은은한 도트 그리드 (지도 느낌) -->
  <g fill="#E5E1D6">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="1000" cy="500" r="2"/><circle cx="1060" cy="500" r="2"/><circle cx="1120" cy="500" r="2"/>
    <circle cx="1000" cy="560" r="2"/><circle cx="1060" cy="560" r="2"/><circle cx="1120" cy="560" r="2"/>
    <circle cx="1000" cy="440" r="2"/><circle cx="1060" cy="440" r="2"/><circle cx="1120" cy="440" r="2"/>
    <circle cx="1000" cy="130" r="2"/><circle cx="1060" cy="130" r="2"/><circle cx="1120" cy="130" r="2"/>
    <circle cx="1000" cy="70" r="2"/><circle cx="1060" cy="70" r="2"/><circle cx="1120" cy="70" r="2"/>
  </g>

  <!-- 좌측 큰 핀 로고 (세로 중앙 정렬) -->
  <g transform="translate(230, 315) scale(3.6)">
    <path
      d="M 0 50 C -40 10, -40 -30, 0 -30 C 40 -30, 40 10, 0 50 Z"
      fill="#FF3D57"
    />
    <circle cx="0" cy="-5" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="14" fill="none" stroke="#FFC700" stroke-width="6" />
    <rect x="-32" y="-8" width="64" height="6" fill="#FFC700" rx="2" />
    <circle cx="0" cy="-5" r="12" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#FFC700" stroke-width="3" />
  </g>

  <!-- 타이틀 (핀과 세로 중앙 정렬) -->
  <text x="440" y="380" font-family="Archivo Black" font-size="100" fill="#16171B" letter-spacing="-2">POPUP MAP</text>
</svg>
