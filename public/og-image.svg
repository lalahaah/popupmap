<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- 은은한 도트 그리드 (지도 느낌) -->
  <g fill="#E5E1D6">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="1000" cy="500" r="2"/><circle cx="1060" cy="500" r="2"/><circle cx="1120" cy="500" r="2"/>
    <circle cx="1000" cy="560" r="2"/><circle cx="1060" cy="560" r="2"/><circle cx="1120" cy="560" r="2"/>
    <circle cx="1000" cy="440" r="2"/><circle cx="1060" cy="440" r="2"/><circle cx="1120" cy="440" r="2"/>
  </g>

  <!-- 좌측 큰 핀 로고 -->
  <g transform="translate(195, 315) scale(2.6)">
    <path
      d="M 0 50 C -40 10, -40 -30, 0 -30 C 40 -30, 40 10, 0 50 Z"
      fill="#FF3D57"
    />
    <circle cx="0" cy="-5" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="14" fill="none" stroke="#FFC700" stroke-width="6" />
    <rect x="-32" y="-8" width="64" height="6" fill="#FFC700" rx="2" />
    <circle cx="0" cy="-5" r="12" fill="#FFFFFF" />
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#FFC700" stroke-width="3" />
  </g>

  <!-- 타이틀 (사이트에서 쓰는 Archivo Black) -->
  <text x="420" y="300" font-family="Archivo Black" font-size="92" fill="#16171B" letter-spacing="-2">POPUP MAP</text>

  <!-- 서브타이틀 -->
  <text x="424" y="362" font-family="Archivo Black" font-size="42" fill="#FF3D57" letter-spacing="-1">POP!! UP!!</text>
  <text x="424" y="415" font-family="Noto Sans CJK KR" font-weight="500" font-size="26" fill="#57534E">팝업스토어를 지도 위에서 한눈에</text>

  <!-- 장식용 D-day 티켓 배지 -->
  <g transform="translate(424, 460)">
    <rect x="0" y="0" width="76" height="40" rx="0" fill="#16171B"/>
    <circle cx="76" cy="20" r="6" fill="#FAFAF7"/>
    <text x="14" y="27" font-family="monospace" font-weight="700" font-size="20" fill="#FAFAF7">D-2</text>
  </g>
  <g transform="translate(516, 460)">
    <rect x="0" y="0" width="76" height="40" rx="0" fill="#FF3D57"/>
    <circle cx="76" cy="20" r="6" fill="#FAFAF7"/>
    <text x="10" y="27" font-family="monospace" font-weight="700" font-size="18" fill="#FAFAF7">NEW</text>
  </g>
  <g transform="translate(608, 460)">
    <rect x="0" y="0" width="90" height="40" fill="#FFC700"/>
    <text x="14" y="27" font-family="Noto Sans CJK KR" font-weight="700" font-size="18" fill="#16171B">뷰티</text>
  </g>
